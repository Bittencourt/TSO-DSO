# Freeze JuliaFormatter v2 style across contributors and CI (RESEARCH Pitfall 4).
# Pinned to JuliaFormatter 2.10.x behaviour.
style = "default"
margin = 92
indent = 4
always_for_in = true
whitespace_typedefs = true
whitespace_ops_in_indices = true
remove_extra_newlines = true
import_to_using = false
normalize_line_endings = "unix"
format_docstrings = true
