name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # LTS floor (INFRA-01 [compat] floor)
          - '1.11'   # current stable
          - '1.12'   # additive insurance
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # INFRA-01: prove clean-checkout resolution against the committed Manifest.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    name: Format check (JuliaFormatter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install JuliaFormatter and check formatting
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2"))
          using JuliaFormatter
          # Uses the committed .JuliaFormatter.toml to freeze v2 style (Pitfall 4).
          # `docs` is now in scope (Phase-9 WR-04 follow-up): the literate pages are
          # formatter-clean, with positional-arg label comments lifted to standalone
          # lines so auto-formatting cannot detach them from the code they annotate.
          if !format(["src", "ext", "test", "docs"]; verbose = true)
              @error "Some files were not formatted. Run JuliaFormatter.format(\".\") locally."
              exit(1)
          end

  docs:
    name: Documentation build (Documenter + Literate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # Must match the Julia version docs/Manifest.toml was resolved with
          # (julia_version = "1.12.5"): the committed docs manifest references the
          # 1.12-only JuliaSyntaxHighlighting stdlib, so instantiating it on an older
          # Julia (e.g. 1.11) fails with "Could not locate the source code". Keep this
          # in lockstep with docs/Manifest.toml's julia_version if the docs env is re-resolved.
          version: '1.12'
      - uses: julia-actions/cache@v2
      # Explicit docs-env instantiate: docs/Manifest.toml (re-resolved in plan 09-04
      # to include CairoMakie) must be installed here — the `format` job above has no
      # instantiate step because it never loads project code, but `docs` builds a real
      # Documenter site with CairoMakie figures, so this step is required (T-09-05).
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: docs
      - name: Build docs
        run: julia --project=docs docs/make.jl
        env:
          CI: 'true'
          # deploydocs() authenticates the gh-pages push with the SSH deploy key
          # stored as the DOCUMENTER_KEY repo secret (public half = the read-write
          # deploy key). GITHUB_TOKEN lets Documenter manage PR-preview deploys/cleanup.
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
