name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # LTS floor (INFRA-01 [compat] floor)
          - '1.11'   # current stable
          - '1.12'   # additive insurance
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # INFRA-01: prove clean-checkout resolution against the committed Manifest.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    name: Format check (JuliaFormatter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install JuliaFormatter and check formatting
        shell: julia --color=yes {0}
        run: |
          using Pkg
          # `Pkg.add(PackageSpec(..., version = ...))` resolves this string through
          # Pkg's plain VersionSpec/VersionRange parser (Pkg.Versions), NOT the
          # semver-operator parser used for [compat] entries in a Project.toml. That
          # parser has no "^"/"~" operators — a leading "~" here throws
          # `ArgumentError: invalid base 10 digit '~'` and crashes Pkg.add outright
          # (verified empirically; do not reintroduce a "~"/"^" prefix on this line).
          # Instead, a bare "N" or "N.M" string is bounded on exactly the components
          # given: "2" matched any 2.x.y (that's what floated us to JuliaFormatter
          # 2.12.6 in practice, which reformats ~48 files under this repo's
          # .JuliaFormatter.toml), but "2.10" matches ONLY 2.10.x — verified by scratch
          # install resolving to JuliaFormatter 2.10.2, matching .JuliaFormatter.toml's
          # own documented "2.10.x behaviour" freeze. DO NOT "simplify" this back to a
          # bare "2" — that reintroduces the float to the newest 2.x release.
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2.10"))
          using JuliaFormatter
          # Uses the committed .JuliaFormatter.toml to freeze v2 style (Pitfall 4).
          # `docs` is now in scope (Phase-9 WR-04 follow-up): the literate pages are
          # formatter-clean, with positional-arg label comments lifted to standalone
          # lines so auto-formatting cannot detach them from the code they annotate.
          if !format(["src", "ext", "test", "docs"]; verbose = true)
              @error "Some files were not formatted. Run JuliaFormatter.format(\".\") locally."
              exit(1)
          end
      - name: Check for formatter content loss
        # if: always() is REQUIRED, not cosmetic. format([...]) above runs with its
        # default overwrite=true, so it REWRITES src/ext/test/docs in place BEFORE
        # deciding pass/fail. The one moment a docstring can be silently damaged
        # (JuliaFormatter's format_docstrings=true + a `|`-continued inline code span
        # -> CommonMark reads it as a table row and drops it, e.g. -148 chars from
        # src/models/restriction_exactness.jl, commit a8f7659) is exactly the moment
        # the PRIOR step's own exit(1) fires on a dirty repo. Without always(), GitHub
        # Actions skips every later step once a step fails, so a plain "runs on
        # success" guard would never see the one case it exists to catch. always()
        # cannot turn a red job green: GitHub Actions computes a job's conclusion from
        # ALL steps' conclusions, so if the format step above exited 1 the job is
        # already failing regardless of what this step reports -- always() only
        # controls whether this step RUNS, not whether its result can override an
        # earlier failure. HEAD is the correct comparison ref: nothing else writes to
        # src/ext/test/docs between actions/checkout@v4 and this step, so `git show
        # HEAD:<path>` still holds the untouched pre-format checkout while the working
        # tree already holds whatever the pinned formatter just wrote (in either the
        # pass or fail branch).
        if: always()
        shell: bash
        run: python3 .github/scripts/check_content_loss.py HEAD

  docs:
    name: Documentation build (Documenter + Literate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # Must match the Julia version docs/Manifest.toml was resolved with
          # (julia_version = "1.12.5"): the committed docs manifest references the
          # 1.12-only JuliaSyntaxHighlighting stdlib, so instantiating it on an older
          # Julia (e.g. 1.11) fails with "Could not locate the source code". Keep this
          # in lockstep with docs/Manifest.toml's julia_version if the docs env is re-resolved.
          version: '1.12'
      - uses: julia-actions/cache@v2
      # Explicit docs-env instantiate: docs/Manifest.toml (re-resolved in plan 09-04
      # to include CairoMakie) must be installed here — the `format` job above has no
      # instantiate step because it never loads project code, but `docs` builds a real
      # Documenter site with CairoMakie figures, so this step is required (T-09-05).
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: docs
      - name: Build docs
        run: julia --project=docs docs/make.jl
        env:
          CI: 'true'
          # deploydocs() authenticates the gh-pages push with the SSH deploy key
          # stored as the DOCUMENTER_KEY repo secret (public half = the read-write
          # deploy key). GITHUB_TOKEN lets Documenter manage PR-preview deploys/cleanup.
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
